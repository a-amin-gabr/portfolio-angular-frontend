<section class="editor-section">
  <div class="editor-intro">
    <span class="card-kicker">Your toolkit</span>
    <h2>Skills</h2>
    <p>Add the technologies that make your work possible.</p>
  </div>
  <form #form="ngForm" (ngSubmit)="add(form)" class="inline-form">
    <label
      >Skill name<input
        name="name"
        [(ngModel)]="skill.name"
        required
        placeholder="Angular" /></label
    ><label
      >Category<select name="category" [(ngModel)]="skill.category" required>
        <option>Frontend</option>
        <option>Backend</option>
        <option>Data</option>
        <option>Workflow</option>
      </select></label
    ><button class="save-button">Add skill <span>+</span></button>
  </form>
  <div class="records">
    @for (item of state.data().skills; track item._id || item.name) {
      <div class="record">
        <div>
          <strong>{{ item.name }}</strong
          ><small>{{ item.category }}</small>
        </div>
        <button (click)="remove(item._id)">Delete</button>
      </div>
    }
  </div>
</section>
